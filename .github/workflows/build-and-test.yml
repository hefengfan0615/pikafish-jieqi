name: Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build engine and run go movetime 5000
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NNUE from AB-JChess v0.2d release
        run: |
          curl -fL --retry 3 -o nnue.zip \
            https://github.com/lxsgx23/AB-JChess/releases/download/v0.2d/0.2d_bmi2.zip
          unzip -p nnue.zip '*/abjchess-20261010.nnue' > src/abjchess-20261010.nnue
          rm -f nnue.zip
          ls -la src/abjchess-20261010.nnue
          [ "$(head -c 12 src/abjchess-20261010.nnue)" = "ABJCHESSV11" ]

      - name: Build engine
        working-directory: src
        run: |
          make -j build EXE=pikafish
          make strip EXE=pikafish

      - name: Run engine test (go movetime 5000)
        working-directory: src
        run: |
          echo "===== Engine full output ====="
          # Keep stdin open until the search finishes, otherwise the engine
          # treats EOF as "quit" and terminates the search early.
          { printf 'uci\nisready\nposition startpos\ngo movetime 5000\n'; sleep 8; printf 'quit\n'; } | ./pikafish
          echo "===== End of output ====="
